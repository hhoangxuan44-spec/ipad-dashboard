<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Network Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #fff; font-family: -apple-system, sans-serif; overflow: hidden; -webkit-user-select: none; }
    /* 双图层交替实现平滑淡入淡出 */
    .bg-layer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background-size: cover; background-position: center; transition: opacity 2s ease-in-out; opacity: 0; z-index: 1; }
    .bg-layer.show { opacity: 1; }
    /* 全局暗色遮罩，保证任何壁纸下文字都清晰 */
    .overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.35); z-index: 2; }
    
    .content { position: absolute; bottom: 40px; left: 40px; z-index: 10; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
    .time { font-size: 6rem; font-weight: 700; letter-spacing: -2px; line-height: 1; margin-bottom: 10px; font-variant-numeric: tabular-nums; }
    .date { font-size: 1.5rem; color: #ddd; letter-spacing: 2px; margin-bottom: 20px; }
    
    .mission { background: rgba(0,0,0,0.4); border-left: 4px solid #00e5ff; padding: 12px 16px; display: inline-block; }
    .mission-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 6px; }
    .mission-sub { font-size: 0.9rem; color: #00e5ff; letter-spacing: 1px; }
  </style>
</head>
<body>
  <div id="bg1" class="bg-layer show"></div>
  <div id="bg2" class="bg-layer"></div>
  <div class="overlay"></div>

  <div class="content">
    <div class="time" id="timeBox">00:00</div>
    <div class="date" id="dateBox">加载中...</div>
    <div class="mission">
      <div class="mission-title">郑州大学 · 信息与通信工程</div>
      <div class="mission-sub" id="countdownBox">距初试: 计算中... | 目标: 350+ (专100+)</div>
    </div>
  </div>

  <script>
    var timeBox = document.getElementById('timeBox');
    var dateBox = document.getElementById('dateBox');
    var countBox = document.getElementById('countdownBox');
    var bg1 = document.getElementById('bg1');
    var bg2 = document.getElementById('bg2');
    var useBg1 = true;

    var days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    function pad(n) { return n < 10 ? '0' + n : n; }

    function updateTime() {
      var now = new Date();
      timeBox.innerText = pad(now.getHours()) + ':' + pad(now.getMinutes());
      dateBox.innerText = now.getFullYear() + '.' + pad(now.getMonth()+1) + '.' + pad(now.getDate()) + ' ' + days[now.getDay()];

      var exam = new Date(2026, 11, 26);
      var diff = Math.ceil((exam - now) / (1000 * 60 * 60 * 24));
      if(diff >= 0) {
        countBox.innerText = '距初试: ' + diff + ' 天 | 目标: 350+ (专100+)';
      } else {
        countBox.innerText = '稳住心态，一战成硕！ | 目标: 350+ (专100+)';
      }
    }

    function switchBg() {
      // 附加时间戳防止浏览器缓存同一张图
      var url = 'https://picsum.photos/1024/768?t=' + new Date().getTime();
      var img = new Image();
      img.onload = function() {
        if (useBg1) {
          bg2.style.backgroundImage = 'url(' + url + ')';
          bg2.className = 'bg-layer show';
          bg1.className = 'bg-layer';
        } else {
          bg1.style.backgroundImage = 'url(' + url + ')';
          bg1.className = 'bg-layer show';
          bg2.className = 'bg-layer';
        }
        useBg1 = !useBg1;
      };
      img.src = url;
    }

    updateTime();
    setInterval(updateTime, 1000);

    // 首次加载
    bg1.style.backgroundImage = 'url(https://picsum.photos/1024/768?t=' + new Date().getTime() + ')';
    
    // 每 5 分钟 (300000 毫秒) 自动拉取公网新壁纸
    setInterval(switchBg, 300000);
  </script>
</body>
</html>
