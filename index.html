<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  body { background: #111; color: #fff; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  #time { font-size: 5rem; font-weight: bold; }
  #countdown { font-size: 2rem; color: #ff5252; margin-top: 15px; }
</style>
</head>
<body>
  <div id="time">00:00:00</div>
  <div id="countdown">计算中...</div>
  <script>
    function update() {
      var now = new Date();
      document.getElementById('time').innerText = now.toTimeString().split(' ')[0];
      var target = new Date('2026-12-26'); // 设定你的目标日期
      var diff = Math.ceil((target - now) / (1000 * 60 * 60 * 24));
      document.getElementById('countdown').innerText = '距离目标还有 ' + diff + ' 天';
    }
    setInterval(update, 1000);
    update();
  </script>
</body>
</html>
