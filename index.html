<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Focus Terminal</title>
  <style>
    * { -webkit-box-sizing: border-box; box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background-color: #000; overflow: hidden; }
    
    body {
      color: #00ff00;
      font-family: "Courier New", Courier, monospace;
      -webkit-user-select: none; user-select: none;
    }

    /* 像素点阵锐利化 */
    .pixelated {
      image-rendering: -webkit-optimize-contrast;
      image-rendering: pixelated;
    }

    /* 静态背景层：支持无缝平铺或全屏拉伸 */
    #bg-layer {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      background-image: url('bg.png'); /* 你的背景图 */
      background-size: cover; /* 如果是小砖块平铺，可以改成: repeat; background-size: auto; */
      background-position: center;
      opacity: 0.35; /* 压暗背景，突出核心时钟 */
      z-index: 1;
    }

    /* CRT 监视器复古扫描线与暗角滤镜 */
    #crt-filter {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 50;
      pointer-events: none;
      background: 
        -webkit-linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%),
        -webkit-radial-gradient(center, ellipse cover, rgba(0,0,0,0) 50%, rgba(0,0,0,0.7) 100%);
      background-size: 100% 4px, 100% 100%;
    }

    /* 核心数据 UI 层 */
    #ui-layer {
      position: relative; z-index: 10;
      width: 100%; height: 100%;
      display: -webkit-box; display: -webkit-flex; display: flex;
      -webkit-box-orient: vertical; -webkit-box-direction: normal; -webkit-flex-direction: column; flex-direction: column;
      -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
      -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    }
    #time-display {
      font-size: 24vw; font-weight: bold; letter-spacing: -2px; line-height: 1;
      text-shadow: 0 0 12px rgba(0, 255, 0, 0.4);
      -webkit-transition: color 0.5s, text-shadow 0.5s;
    }
    #target-display {
      position: absolute; bottom: 10%; font-size: 3.5vw; color: #555; letter-spacing: 2px;
    }

    /* 隐形三等分物理按键区 */
    .touch-zone { position: absolute; top: 0; height: 100%; z-index: 100; }
    #zone-wave { left: 0; width: 33.3%; }
    #zone-clock { left: 33.3%; width: 33.4%; }
    #zone-rain { right: 0; width: 33.3%; }
  </style>
</head>
<body>

  <!-- 音频通道 -->
  <audio id="bg-audio" loop></audio>

  <!-- 视觉渲染层 -->
  <div id="bg-layer" class="pixelated"></div>
  <div id="crt-filter"></div>

  <!-- UI 界面 -->
  <div id="ui-layer">
    <div id="time-display">00:00</div>
    <div id="target-display">TARGET: 350+ | 专业课: 100+</div>
  </div>

  <!-- 触控交互区 -->
  <div id="zone-wave" class="touch-zone"></div>
  <div id="zone-clock" class="touch-zone"></div>
  <div id="zone-rain" class="touch-zone"></div>

  <script>
    var STATE = 'CLOCK';
    var FOCUS_TIME = 45 * 60; // 45分钟专注
    var clockTimer = null, focusTimer = null;
    var displayEl = document.getElementById('time-display');
    var audioEl = document.getElementById('bg-audio');

    function pad(num) { return ('0' + num).slice(-2); }

    function startClock() {
      STATE = 'CLOCK';
      if (focusTimer) clearInterval(focusTimer);
      displayEl.style.color = '#00ff00';
      displayEl.style.textShadow = '0 0 12px rgba(0, 255, 0, 0.4)';
      audioEl.pause();

      function tick() {
        var now = new Date();
        displayEl.innerText = pad(now.getHours()) + ':' + pad(now.getMinutes());
      }
      tick();
      clockTimer = setInterval(tick, 1000);
    }

    function startFocus(mode) {
      if (clockTimer) clearInterval(clockTimer);
      if (focusTimer) clearInterval(focusTimer);
      STATE = mode;
      var secondsLeft = FOCUS_TIME;
      
      // 专注模式切换为冷白光
      displayEl.style.color = '#ffffff';
      displayEl.style.textShadow = '0 0 18px rgba(255, 255, 255, 0.4)';
      
      if (mode === 'WAVE') {
        audioEl.src = 'wave.mp3';
      } else {
        audioEl.src = 'rain.mp3';
      }
      audioEl.play();

      function tickDown() {
        var m = Math.floor(secondsLeft / 60);
        var s = secondsLeft % 60;
        displayEl.innerText = pad(m) + ':' + pad(s);
        
        if (secondsLeft <= 0) {
          clearInterval(focusTimer);
          audioEl.src = 'alarm.mp3';
          audioEl.loop = false;
          audioEl.play();
          setTimeout(startClock, 3000); 
        }
        secondsLeft--;
      }
      tickDown();
      focusTimer = setInterval(tickDown, 1000);
    }

    // 绑定触控
    document.getElementById('zone-wave').addEventListener('touchend', function(e) {
      e.preventDefault(); if (STATE !== 'WAVE') startFocus('WAVE');
    });
    document.getElementById('zone-rain').addEventListener('touchend', function(e) {
      e.preventDefault(); if (STATE !== 'RAIN') startFocus('RAIN');
    });
    document.getElementById('zone-clock').addEventListener('touchend', function(e) {
      e.preventDefault(); if (STATE !== 'CLOCK') startClock();
    });

    startClock();
  </script>
</body>
</html>
