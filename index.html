<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>考研专注屏</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      background: #000; 
      color: #fff; 
      font-family: -apple-system, sans-serif; 
      overflow: hidden; 
      -webkit-user-select: none; 
    }
    
    /* 静态背景图层 */
    .bg-image {
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100vw; 
      height: 100vh;
      /* 这里直接引用你上传到 GitHub 的 bg.jpg */
      background-image: url('./bg.jpg'); 
      background-size: cover; 
      background-position: center; 
      background-repeat: no-repeat;
      z-index: 1;
    }
    
    /* 黑色半透明遮罩，保证文字清晰 */
    .overlay { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100vw; 
      height: 100vh; 
      background: rgba(0,0,0,0.35); 
      z-index: 2; 
    }
    
    /* 内容排版 */
    .content { 
      position: absolute; 
      bottom: 8vh; 
      left: 6vw; 
      z-index: 10; 
      text-shadow: 0 4px 15px rgba(0,0,0,0.8); 
    }
    .time { 
      font-size: 7rem; 
      font-weight: 700; 
      letter-spacing: -3px; 
      line-height: 1; 
      margin-bottom: 15px; 
      font-variant-numeric: tabular-nums; 
    }
    .date { 
      font-size: 1.8rem; 
      color: #7dd3fc; 
      letter-spacing: 2px; 
      margin-bottom: 25px; 
      font-weight: 300; 
    }
    
    .mission { 
      background: rgba(15, 23, 42, 0.7); 
      border-left: 5px solid #00e5ff; 
      padding: 15px 20px; 
      display: inline-block; 
      box-shadow: 0 4px 20px rgba(0,0,0,0.5); 
    }
    .mission-title { 
      font-size: 1.3rem; 
      font-weight: bold; 
      margin-bottom: 8px; 
    }
    .mission-sub { 
      font-size: 1.1rem; 
      color: #00e5ff; 
      letter-spacing: 1px; 
    }
  </style>
</head>
<body>
  <div class="bg-image"></div>
  <div class="overlay"></div>

  <div class="content">
    <div class="time" id="timeBox">00:00</div>
    <div class="date" id="dateBox">加载中...</div>
    <div class="mission">
      <div class="mission-title">郑州大学 · 信息与通信工程</div>
      <div class="mission-sub" id="countdownBox">距初试: 计算中... | 目标: 350+ (专100+)</div>
    </div>
  </div>

  <script>
    var timeBox = document.getElementById('timeBox');
    var dateBox = document.getElementById('dateBox');
    var countBox = document.getElementById('countdownBox');

    var days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    function pad(n) { return n < 10 ? '0' + n : n; }

    function updateTime() {
      var now = new Date();
      timeBox.innerText = pad(now.getHours()) + ':' + pad(now.getMinutes());
      dateBox.innerText = now.getFullYear() + '.' + pad(now.getMonth()+1) + '.' + pad(now.getDate()) + ' ' + days[now.getDay()];

      var exam = new Date(2026, 11, 26);
      var diff = Math.ceil((exam - now) / (1000 * 60 * 60 * 24));
      if(diff >= 0) {
        countBox.innerText = '距初试: ' + diff + ' 天 | 目标: 350+ (专100+)';
      } else {
        countBox.innerText = '稳住心态，一战成硕！';
      }
    }

    updateTime();
    setInterval(updateTime, 1000);
  </script>
</body>
</html>
