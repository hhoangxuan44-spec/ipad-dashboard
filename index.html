<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- 允许全屏 WebApp 模式运行（隐藏 Safari 顶底栏） -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Clock</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: #050505;
      color: #ECECEC;
      font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      /* 放弃 flex，使用相对定位作为基准，确保在老旧 iOS 上不会乱跑 */
      position: relative;
      overflow: hidden;
      -webkit-user-select: none;
    }
    
    .clock-card {
      /* 使用绝对定位进行屏幕居中，这是 iOS 8 最稳定的居中方式 */
      position: absolute;
      top: 50%;
      left: 50%;
      -webkit-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
      width: 320px;
      height: 320px;
    }
    
    /* 动态旋转外环画布 */
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 320px;
      height: 320px;
      z-index: 1;
    }

    .text-container {
      /* 将文字容器独立居中悬浮在 canvas 之上 */
      position: absolute;
      top: 50%;
      left: 50%;
      -webkit-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 2;
      width: 100%;
    }
    
    .time-box {
      /* 将 rem 转换为固定的 px 像素，增加旧版系统稳定性 */
      font-size: 76px;
      font-weight: 300;
      letter-spacing: -2px;
      line-height: 1;
    }
    
    .colon {
      display: inline-block;
      -webkit-transition: opacity 0.3s;
      transition: opacity 0.3s;
      opacity: 1;
    }
    
    .date-box {
      margin-top: 14px;
      font-size: 16px;
      color: #888;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

<div class="clock-card">
  <canvas id="ring" width="640" height="640"></canvas>
  <div class="text-container">
    <div class="time-box">
      <span id="hours">00</span><span class="colon" id="colon">:</span><span id="mins">00</span>
    </div>
    <div class="date-box" id="date">JAN 01 · WED</div>
  </div>
</div>

<script>
  // 保持使用 var，完美兼容 iOS 8 的 ES5 标准
  var ring = document.getElementById('ring');
  var ctx = ring.getContext('2d');
  var hoursEl = document.getElementById('hours');
  var minsEl = document.getElementById('mins');
  var colonEl = document.getElementById('colon');
  var dateEl = document.getElementById('date');

  var days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];

  function pad(n) { return n < 10 ? '0' + n : n; }

  function render() {
    var now = new Date();
    var ms = now.getMilliseconds();
    var sec = now.getSeconds() + ms / 1000;
    var min = now.getMinutes();
    var hr = now.getHours();

    // 更新数字时钟
    hoursEl.innerText = pad(hr);
    minsEl.innerText = pad(min);

    // 冒号呼吸渐隐动画
    colonEl.style.opacity = (sec % 1 > 0.5) ? '0.2' : '1';

    // 更新日期
    var month = now.getMonth() + 1;
    var day = now.getDate();
    var week = days[now.getDay()];
    dateEl.innerText = month + '月' + day + '日 · ' + week;

    // 绘制外圈平滑走动的秒针光环 (Canvas 硬件加速)
    ctx.clearRect(0, 0, 640, 640);

    // 底环灰色轮廓
    ctx.beginPath();
    ctx.arc(320, 320, 280, 0, 2 * Math.PI);
    ctx.strokeStyle = '#181818';
    ctx.lineWidth = 6;
    ctx.stroke();

    // 动态进度光环
    var endAngle = (-0.5 + (sec / 60) * 2) * Math.PI;
    ctx.beginPath();
    ctx.arc(320, 320, 280, -0.5 * Math.PI, endAngle);
    ctx.strokeStyle = '#ECECEC';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.stroke();

    // 兼容写法
    var reqAnimFrame = window.requestAnimationFrame || window.webkitRequestAnimationFrame;
    if (reqAnimFrame) {
      reqAnimFrame(render);
    } else {
      setTimeout(render, 1000 / 60);
    }
  }

  // 启动渲染
  render();
</script>
</body>
</html>
